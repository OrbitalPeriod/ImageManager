services:
  AnimeTagger:
    image: orbitalperiod1337/imagemanager-animetagger:latest
    build:
      context: ./AnimeTagger/
    env_file:
      - "./.env"
      - "./.docker.env"
    networks: ["imagemanager_network"]

  imagemanager:
    image: orbitalperiod1337/imagemanager-backend:latest
    build:
      context: ./ImageManager/ 
    ports:
      - "8174:8080"
    env_file:
      - "./.env"
      - "./.docker.env"
      - path: "./.secrets.env"
        required: false
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CORS_ALLOWED_ORIGIN=https://animeimages.orbitalperiod.net
    volumes:
      - images:/Images
    depends_on:
      database:
        condition: service_healthy
    networks: ["imagemanager_network"]

  database:
    image: postgres:latest
    env_file:
      - "./.env"
      - "./.docker.env"
    volumes:
      - db-data:/var/lib/postgresql
    networks: ["imagemanager_network"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresql"]
      interval: 5s
      timeout: 2s
      retries: 10


  frontend:
    image: orbitalperiod1337/imagemanager-frontend:latest
    build:
      context: ./frontend/
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    env_file:
      - "./.env"
      - "./.docker.env"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    networks:
      - imagemanager_network

networks:
  imagemanager_network:
    driver: bridge

volumes:
  db-data:
  images:
